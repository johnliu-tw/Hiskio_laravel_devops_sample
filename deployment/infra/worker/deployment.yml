apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: johnliutw/laravel-devops-worker:20f803b6d0343442e42364ef408e65da5fce92c0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "200m"
              memory: "64Mi"
          envFrom:
            - configMapRef:
                name: blog
            - secretRef:
                name: blog