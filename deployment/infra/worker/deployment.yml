apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 30%
      maxUnavailable: 20%
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: johnliutw/laravel-devops-worker:20f803b6d0343442e42364ef408e65da5fce92c0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "200m"
              memory: "64Mi"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - php /usr/src/artisan queue:monitor default
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 2
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - php /usr/src/artisan queue:monitor default
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 1
          envFrom:
            - configMapRef:
                name: blog
            - secretRef:
                name: blog